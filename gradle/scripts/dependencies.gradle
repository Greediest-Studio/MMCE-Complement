apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal() // Must be last for caching to work
}

dependencies {
    // Include StripLatestForgeRequirements by default for the dev env, saves everyone a hassle
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    // Optional integrations are compile-only. They must not become runtime or
    // published hard dependencies; their registration is guarded in CompatMods.
    compileOnly rfg.deobf('curse.maven:flux-networks-248020:3178199')
    // Needed only by the Flux hatch unit tests, never by the normal runtime.
    testCompileOnly rfg.deobf('curse.maven:flux-networks-248020:3178199')
    testRuntimeOnly rfg.deobf('curse.maven:flux-networks-248020:3178199')
    // MMCE and AE2 are the two intentional gameplay hard dependencies.
    implementation rfg.deobf('curse.maven:modularmachinery-community-edition-817377:7372951')
    // Optional at runtime. The quadruple fluid hatch exposes Mekanism's gas
    // API only when Mekanism is installed, matching MMCE's native fluid hatches.
    compileOnly rfg.deobf('curse.maven:mekanism-ce-unofficial-840735:8411935')
    // Compile the gas-modifier tests against the same optional API.
    testCompileOnly rfg.deobf('curse.maven:mekanism-ce-unofficial-840735:8411935')
    // Optional gas storage channel used by MMCE's ME gas input bus.
    compileOnly rfg.deobf('curse.maven:mekanism-energistics-1027681:5408319')
    // MMCE's public fluid-component hierarchy references Mekanism API types,
    // so tests that instantiate a fluid hatch need the optional API at runtime.
    testRuntimeOnly rfg.deobf('curse.maven:mekanism-ce-unofficial-840735:8411935')
    // MMCE exposes GeckoLib interfaces in its public controller hierarchy, but
    // CurseMaven does not provide MMCE's transitive dependency metadata.
    compileOnly rfg.deobf('curse.maven:geckolib-388172:4020277')
    compileOnly rfg.deobf('curse.maven:ae2-extended-life-570458:5411078')
    // MMCE's pattern provider recognizes AE2 Fluid Crafting Rework fake
    // fluid/gas ingredients. Provider II mirrors that optional behavior.
    compileOnly rfg.deobf('curse.maven:ae2-fluid-crafting-rework-623955:5751930')
    compileOnly rfg.deobf('curse.maven:crazyae-1111042:6840104')
    compileOnly rfg.deobf('curse.maven:baubles-227083:2518667')
    compileOnly rfg.deobf('curse.maven:botania-225643:3330934')
    runtimeOnly rfg.deobf('curse.maven:ae2-extended-life-570458:5411078')
    // MMCE hard-requires CraftTweaker2 at runtime; compile against its ZenScript
    // annotations for this add-on's RecipePrimer and IMachineController expansions.
    compileOnly 'curse.maven:crafttweaker-239197:8051578'
    // Development runtime for exercising MMCE's JEI structure preview.
    compileOnly rfg.deobf('curse.maven:had-enough-items-557549:4543375')

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - Deobfuscating dependencies:
    // rfg.deobf('curse.maven:had-enough-items-557549:4543375')
    // By wrapping a dependency descriptor in rfg.deobf() method call, the dependency is queued for deobfuscation
    // When deobfuscating, RFG respects the mapping_channel + mapping_version stated in gradle.properties

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Common dependency types (configuration):
    // implementation = dependency available at both compile time and runtime
    // runtimeOnly = runtime dependency
    // compileOnly = compile time dependency
    // annotationProcessor = annotation processing dependencies
    // embed = bundle dependencies into final output artifact (no relocation)

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }
}
